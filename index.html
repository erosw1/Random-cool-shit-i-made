<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1D Heat Conduction Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #d3d3d3;
      padding: 20px;
    }
    canvas {
      background: white;
      border: 2px solid black;
    }
    button, select {
      margin: 5px;
      padding: 5px 10px;
    }
  </style>
</head>
<body>

<h2>1D Heat Conduction Simulator</h2>

<label>Material:</label>
<select id="material">
  <option value="2.3e-5">Iron (Pure)</option>
  <option value="1.1e-4">Aluminum</option>
  <option value="1.2e-5">Steel</option>
</select>

<p>Thermal diffusivity α = <span id="alphaVal">2.3e-5</span> m²/s</p>

<button onclick="start()">Start</button>
<button onclick="reset()">Reset</button>

<p>Time: <span id="time">0.000</span> s</p>

<canvas id="plot" width="600" height="200"></canvas>

<script>
/* ---------------- Physics Parameters ---------------- */
const N = 50;           // spatial points
const L = 1.0;          // rod length (m)
const dx = L / (N - 1);
let alpha = 2.3e-5;
const dt = 0.2 * dx * dx / alpha; // CFL condition
let t = 0;

let T = new Array(N).fill(20);
let Tnew = new Array(N).fill(20);

T[0] = 100;
T[N - 1] = 50;

let interval = null;

/* ---------------- Simulation Functions ---------------- */
function step() {
  for (let i = 1; i < N - 1; i++) {
    Tnew[i] =
      T[i] +
      alpha * dt / (dx * dx) *
      (T[i + 1] - 2 * T[i] + T[i - 1]);
  }

  Tnew[0] = 100;
  Tnew[N - 1] = 50;

  [T, Tnew] = [Tnew, T];

  t += dt;
  document.getElementById("time").textContent = t.toFixed(3);

  draw();
}

/* ---------------- Plotting ---------------- */
function draw() {
  const c = document.getElementById("plot");
  const ctx = c.getContext("2d");

  ctx.clearRect(0, 0, c.width, c.height);

  ctx.beginPath();
  ctx.strokeStyle = "red";

  for (let i = 0; i < N; i++) {
    const x = (i / (N - 1)) * c.width;
    const y = c.height - (T[i] / 120) * c.height;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();
}

/* ---------------- Controls ---------------- */
function start() {
  if (interval) return;
  interval = setInterval(step, 30);
}

function reset() {
  clearInterval(interval);
  interval = null;
  t = 0;
  T.fill(20);
  T[0] = 100;
  T[N - 1] = 50;
  draw();
}

document.getElementById("material").onchange = e => {
  alpha = parseFloat(e.target.value);
  document.getElementById("alphaVal").textContent = alpha;
};

draw();
</script>

</body>
</html>
